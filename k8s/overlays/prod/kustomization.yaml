apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - app-configmap.yaml
  - ingress.yaml

patches:
  - path: api-resources-patch.yaml
  - path: api-hpa-patch.yaml

images:
  - name: caro-game-api
    newName: your-dockerhub-user/caro-api
    newTag: v1.0.0

  - name: caro-game-web
    newName: your-dockerhub-user/caro-web
    newTag: v1.0.0